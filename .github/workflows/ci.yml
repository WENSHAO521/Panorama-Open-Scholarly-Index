name: Checks

# Type check, lint and unit tests on every pull request and push to master. The Cloudflare Pages build
# compiles the site but does not run these, so a pull request could merge with a failing test.

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
