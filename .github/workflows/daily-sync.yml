name: Daily Journal Sync

on:
  schedule:
    - cron: '0 2 * * *'   # 每天 UTC 02:00（北京时间 10:00）
  workflow_dispatch:        # 允许手动触发

permissions:
  contents: write           # 写入权限（commit + push）

jobs:
  sync:
    runs-on: ubuntu-latest
    # auto-PQF is capped at 20 minutes below; the rest of the job takes a few.
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 步骤 1：从 DOAJ + OpenAlex 发现新期刊
      # --limit 100 避免单次运行时间过长；API 有礼貌延迟 300ms/请求
      - name: Discover new journals (DOAJ + OpenAlex)
        run: node scripts/discover-journals.mjs --openalex-doaj --write --limit 100
        env:
          DOAJ_API_KEY: ${{ secrets.DOAJ_API_KEY }}

      # 步骤 1a：把仍以代码存储的国家（ISO / MARC，如 KR、IO、CAU）改写成国家名
      # 新期刊在发现时已按 ISO 转换；这一步兜底处理其他来源带进来的代码，判断不了的原样保留。
      - name: Normalize country codes
        run: node scripts/normalize-countries.mjs --write

      # 步骤 1b：从 Crossref 补缺失的出版商和国家（只填空字段）
      # 约 8,000 本待查，每天限时 12 分钟，按未查过→查得最早的顺序分几天查完；查过的 90 天内不重查。
      # Crossref 不响应时脚本自己停下，不影响后面的步骤。
      - name: Fill missing publishers from Crossref
        run: node scripts/enrich-publishers.mjs --write --budget-minutes 12

      # 步骤 2：重新计算 metadata quality score
      - name: Recalculate metadata quality scores
        run: node scripts/calc-discovered-mqs.mjs

      # 步骤 3：为发现的期刊更新 auto-PQF 评分（直接站点验证优先，DOAJ 仅作为披露的后备信号）
      # 增量评分：先评从未评过的期刊，再按评分日期从旧到新刷新，20 分钟到点即停并保存。
      # 以前每天重爬全部约 24,000 个期刊网站，永远跑不完 30 分钟，整步被取消，什么都没保存。
      - name: Update auto-PQF scores
        run: node scripts/auto-pqf.mjs --write --budget-minutes 20

      # Early-Stage 评级不在这里计算：核心合集记录（含评级）由 posi-data 按 AJR-E-1.1
      # 审计生成，经 data-sync 同步过来。原先这里的本地评级步骤会把它们改写成已停用的
      # AJR-E-1.0 格式（没有总分），所以已删除。

      # 有变化才 commit，无变化静默退出（不产生空 commit）
      - name: Commit and push if changed
        run: |
          git config user.name  "posi-sync-bot"
          git config user.email "posi-sync-bot@users.noreply.github.com"
          git add src/lib/discovered-journals.json
          if git diff --staged --quiet; then
            echo "No changes — skipping commit"
          else
            JOURNAL_COUNT=$(node -e "console.log(require('./src/lib/discovered-journals.json').length)")
            git commit -m "chore(data): daily sync $(date -u +%Y-%m-%d) — ${JOURNAL_COUNT} records"
            # Another data job may have pushed meanwhile; they touch different files.
            git pull --rebase --autostash --quiet origin master
            git push
          fi

      # 步骤 4：不管上面有没有 commit，都强制触发一次 Cloudflare Pages 重新构建。
      # PCI（OpenAlex 2yr mean citedness/h-index）和 Related Datasets（Zenodo）都是
      # build 时现抓的实时数据，不写进 data.ts——如果当天没有新期刊、没有 git diff，
      # 上面那步就不会 push，也就不会触发 Cloudflare Pages 自动部署，这些数字会跟着卡住。
      # 需要在 Cloudflare Pages 项目设置里创建一个 Deploy Hook，并把 URL 存进
      # Actions secret CLOUDFLARE_DEPLOY_HOOK_URL；没配置的话这步会跳过，不影响其余步骤。
      - name: Trigger Cloudflare Pages rebuild (refresh PCI + Zenodo data)
        env:
          HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL || vars.CLOUDFLARE_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$HOOK" ]; then curl -sf -X POST "$HOOK"; else echo "No deploy hook configured"; fi
