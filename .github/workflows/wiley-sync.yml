name: Wiley Journal Sync

# 每月从 Crossref 补充 Wiley（会员号 311）新出现的期刊到 src/lib/discovered-journals.json。
# 做法：读取该会员近期期刊文章的 ISSN，和库里已有的 ISSN 去重，新的按统一格式加入
# （订阅制期刊 open_access=false，DOAJ 收录的为 true）。只新增，不改已有记录。
# 细节见 scripts/sync-crossref-publisher.mjs 顶部注释。
# 全量回填：手动触发，把 since 填成 2018-01-01。

on:
  schedule:
    - cron: '43 6 3 * *'        # 每月 3 日 UTC 06:43，避开每日同步和 DOAJ 同步
  workflow_dispatch:
    inputs:
      since:
        description: '扫描起始日期（YYYY-MM-DD）；留空为最近 120 天，全量回填填 2018-01-01'
        required: false
        default: ''

# 和其他数据任务写同一个文件，排队执行，不并发
concurrency:
  group: discovered-journals
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 扫描失败或没读到任何 ISSN 时直接失败、不写入
      - name: Add new Wiley journals from Crossref
        run: |
          SINCE_ARG=""
          if [ -n "${{ github.event.inputs.since }}" ]; then SINCE_ARG="--since ${{ github.event.inputs.since }}"; fi
          node scripts/sync-crossref-publisher.mjs --member 311 --name Wiley --match wiley \
            --site 'https://onlinelibrary.wiley.com/journal/{issn}' --min-issns 500 $SINCE_ARG --write

      - name: Normalize country codes
        run: node scripts/normalize-countries.mjs --write

      - name: Recalculate metadata quality scores
        run: node scripts/calc-discovered-mqs.mjs

      # 有变化才 commit；push 会触发 Cloudflare Pages 自动部署
      - name: Commit and push if changed
        run: |
          git config user.name  "posi-sync-bot"
          git config user.email "posi-sync-bot@users.noreply.github.com"
          git add src/lib/discovered-journals.json
          if git diff --staged --quiet; then
            echo "No changes — skipping commit"
          else
            JOURNAL_COUNT=$(node -e "console.log(require('./src/lib/discovered-journals.json').length)")
            git commit -m "chore(data): Wiley sync $(date -u +%Y-%m-%d) — ${JOURNAL_COUNT} records"
            git pull --rebase --autostash --quiet origin master
            git push
          fi
