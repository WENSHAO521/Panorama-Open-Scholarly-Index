name: Data sync

# Keeps the site on the latest published data without manual steps:
#   1. pulls the small collections (Core Collection, curated Global Benchmark,
#      PCS, PCI, and the retired Citation Q archive) from data.posi.panorama-sg.com;
#   2. checks the Citation Ranking and PCS editions can be read and refreshes the
#      journal-name table;
#   3. records the upstream editions in src/lib/data-editions.json (the data
#      layer's snapshot and release, and posi-engine's newest global index);
#   4. commits whatever changed. The push is what rebuilds the site: Cloudflare
#      Pages builds every push, and the build's prebuild step downloads the
#      global corpus and ranking edition (scripts/sync-live-data.mjs).
#
# Upstream: posi-engine publishes global-index releases, posi-data imports the
# ranking edition, and posi-data-delivery publishes snapshots. The steps check
# every 20 minutes, staggered (posi-data :02, posi-data-delivery :08, this sync
# :14, each hour at 20-minute steps), so a new edition reaches the site within
# about an hour instead of up to nine. A check that finds nothing new changes
# nothing and costs about a minute.

on:
  schedule:
    - cron: '14,34,54 * * * *'   # every 20 minutes, 6 minutes after posi-data-delivery
  workflow_dispatch:

concurrency:
  group: data-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync collections
        run: node scripts/sync-corpus.mjs

      - name: Sync ranking edition and journal names
        run: |
          # Checks that the edition can be read. It is not copied into the repo:
          # the global editions are large, and every build downloads them itself
          # (prebuild: sync-live-data.mjs). src/lib/citation-ranking.json and
          # src/lib/pcs-q.json stay small fallbacks; data-editions.json below records the snapshot, and its
          # change is what triggers the Cloudflare rebuild.
          node scripts/sync-live-data.mjs --rankings-only
          node scripts/sync-ranking-titles.mjs || echo "Journal names unchanged (data layer unreachable)"

      - name: Record upstream editions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/record-data-editions.mjs

      - name: Commit if changed
        run: |
          git config user.name  "posi-sync-bot"
          git config user.email "posi-sync-bot@users.noreply.github.com"
          git add src/lib/core-collection.json src/lib/global-benchmark.json src/lib/pcs.json src/lib/pci.json \
                  src/lib/citation-rankings.json src/lib/ranking-titles.json \
                  src/lib/data-editions.json
          if git diff --staged --quiet; then
            echo "No data changes; the site is on $(cat src/lib/data-editions.json | tr -d '\n ')" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "chore(data): sync data $(date -u +%Y-%m-%d)"
            # Another data job may have pushed meanwhile; they touch different files.
            git pull --rebase --autostash --quiet origin master
            git push
            echo "Synced and pushed; Cloudflare Pages rebuilds from this push." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
